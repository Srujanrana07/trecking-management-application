{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width:600px;">

<h2 class="text-center mb-4">
Register
</h2>

<form method="POST">

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Contact</label>

<input
type="text"
name="contact"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Register As</label>

<select
name="role"
class="form-select">

<option value="user">
User
</option>

<option value="staff">
Trek Staff
</option>

</select>

</div>

<button
class="btn btn-success w-100">

Register

</button>

</form>

<div class="mt-3 text-center">

<a href="{{ url_for('auth.login') }}">

Already have an account?

</a>

</div>

</div>

{% endblock %}
