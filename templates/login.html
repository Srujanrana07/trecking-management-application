<!-- login.html -->
 {% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width:500px;">

    <h2 class="mb-4 text-center">Login</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-warning">
                    {{ msg }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">
            <label>Email</label>
            <input
                type="email"
                name="email"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input
                type="password"
                name="password"
                class="form-control"
                required>
        </div>

        <button class="btn btn-success w-100">
            Login
        </button>

    </form>

    <div class="mt-3 text-center">
        <a href="{{ url_for('auth.register') }}">
            Register Here
        </a>
    </div>

</div>

{% endblock %}
