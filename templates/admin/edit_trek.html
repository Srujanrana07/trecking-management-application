{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Edit Trek</h2>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">Trek Name</label>

            <input
                type="text"
                name="name"
                class="form-control"
                value="{{ trek.name }}"
                required>

        </div>

        <div class="mb-3">

            <label>Location</label>

            <input
                type="text"
                name="location"
                class="form-control"
                value="{{ trek.location }}"
                required>

        </div>

        <div class="mb-3">

            <label>Difficulty</label>

            <select
                name="difficulty"
                class="form-select">

                <option value="Easy"
                    {% if trek.difficulty == "Easy" %}selected{% endif %}>
                    Easy
                </option>

                <option value="Moderate"
                    {% if trek.difficulty == "Moderate" %}selected{% endif %}>
                    Moderate
                </option>

                <option value="Hard"
                    {% if trek.difficulty == "Hard" %}selected{% endif %}>
                    Hard
                </option>

            </select>

        </div>

        <div class="mb-3">

            <label>Duration (Days)</label>

            <input
                type="number"
                name="duration"
                class="form-control"
                value="{{ trek.duration }}"
                required>

        </div>

        <div class="mb-3">

            <label>Available Slots</label>

            <input
                type="number"
                name="available_slots"
                class="form-control"
                value="{{ trek.available_slots }}"
                required>

        </div>

        <div class="mb-3">

            <label>Status</label>

            <select
                name="status"
                class="form-select">

                <option value="Open"
                    {% if trek.status == "Open" %}selected{% endif %}>
                    Open
                </option>

                <option value="Closed"
                    {% if trek.status == "Closed" %}selected{% endif %}>
                    Closed
                </option>

                <option value="Completed"
                    {% if trek.status == "Completed" %}selected{% endif %}>
                    Completed
                </option>

            </select>

        </div>

        <div class="mb-3">

            <label>Start Date</label>

            <input
                type="date"
                name="start_date"
                class="form-control"
                value="{{ trek.start_date }}"
                required>

        </div>

        <div class="mb-3">

            <label>End Date</label>

            <input
                type="date"
                name="end_date"
                class="form-control"
                value="{{ trek.end_date }}"
                required>

        </div>

        <div class="mb-3">

            <label>Description</label>

            <textarea
                name="description"
                rows="4"
                class="form-control">{{ trek.description }}</textarea>

        </div>

        <button
            type="submit"
            class="btn btn-success">

            Update Trek

        </button>

        <a href="{{ url_for('admin.view_treks') }}"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
